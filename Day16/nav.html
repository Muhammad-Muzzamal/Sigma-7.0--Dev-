<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
  --primary-color: #0a0a0a;
  --secondary-color: #555;
  --accent-color: #d4af37; /* Gold accent for luxury feel */
  --bg-color: #f9f9f9;
  --transition: all 0.4s cubic-bezier(0.65, 0, 0.35, 1);
}

.navbar {
  background-color: var(--bg-color);
  padding: 1.8rem 5vw;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}

.navbar-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1400px;
  margin: 0 auto;
}

.navbar-brand {
  display: flex;
  align-items: baseline;
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--primary-color);
  letter-spacing: -0.5px;
}

.logo-dot {
  color: var(--accent-color);
  font-size: 2.2rem;
  line-height: 0;
}

.navbar-links {
  display: flex;
  gap: 2.5rem;
}

.nav-link {
  position: relative;
  color: var(--secondary-color);
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 400;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  text-decoration: none;
  padding: 0.5rem 0;
  transition: var(--transition);
}

.link-number {
  color: var(--accent-color);
  margin-right: 0.3rem;
  font-size: 0.7rem;
}

.nav-link:hover {
  color: var(--primary-color);
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 1px;
  background-color: var(--accent-color);
  transition: var(--transition);
}

.nav-link:hover::after {
  width: 100%;
}

.navbar-cta {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.cta-line {
  width: 40px;
  height: 1px;
  background-color: var(--accent-color);
}

.cta-button {
  background: transparent;
  border: 1px solid var(--accent-color);
  color: var(--primary-color);
  padding: 0.8rem 1.8rem;
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.cta-button:hover {
  background-color: var(--accent-color);
  color: white;
}

.arrow-icon {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  transition: var(--transition);
}

.cta-button:hover .arrow-icon {
  transform: translateX(3px);
}
    </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <span class="logo">evnestic</span>
      <span class="logo-dot">.</span>
    </div>
    
    <div class="navbar-links">
      <a href="#" class="nav-link"><span class="link-number">01.</span> Home</a>
      <a href="#" class="nav-link"><span class="link-number">02.</span> About</a>
      <a href="#" class="nav-link"><span class="link-number">03.</span> Services</a>
      <a href="#" class="nav-link"><span class="link-number">04.</span> Portfolio</a>
      <a href="#" class="nav-link"><span class="link-number">05.</span> Team</a>
      <a href="#" class="nav-link"><span class="link-number">06.</span> Contact</a>
    </div>
    
    <div class="navbar-cta">
      <div class="cta-line"></div>
      <button class="cta-button">
        <span>Get Started</span>
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </div>
</nav>
</body>
</html>
