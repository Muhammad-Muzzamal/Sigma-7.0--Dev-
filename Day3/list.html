<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
  </head>
  <body>
    <h1>List in HTML</h1>
    <!-- Unordered List -->
    <h2>Unordered List :</h2>
    <ul>
      <li>Bread</li>
      <li>Jam</li>
      <li>Frooti</li>
      <li>Samosa</li>
      <li>Dosa</li>
    </ul>

    <!-- Ordered List -->
    <h2>Ordered List</h2>
    <ol type="1">
        <li>Bread</li>
        <li>Jam</li>
        <li>Samosa</li>
        <li>Frooti</li>
        <li>Dosa</li>
    </ol>

    <h2>Note</h2>
    <p>there is a type attribute in ordered list that is used to change the type of the ordered list</p>
  </body>
</html>
