<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Units</title>
    <style>
        #outer{
            background: red;
            width: 100%;
            height: 100vh;
        }
        #inner{
            background: green;
            width: 33.3%;
            height: 90%;
        }
    </style>
</head>
<body>
    <div id="outer">
        <div id="inner">df</div>
    </div>
</body>
</html>
