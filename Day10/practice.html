<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <style>
        .signal {
            height: 200px;
            width: 70px;
            border: 2px solid black;
        }

        .circle {
            height: 50px;
            width: 50px;
            border: 2px solid black;
            margin: 10px;
            border-radius: 50px;
        }
    .red{
        background: red;
    }
    .yellow{
        background: yellow;
    }
    .green{
        background: green;
    }
    </style>
</head>
<body>
    <div class="signal">
        <div class="circle red"></div>
        <div class="circle yellow"></div>
        <div class="circle green"></div>
    </div>
</body>
</html>
