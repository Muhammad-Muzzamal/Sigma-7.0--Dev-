<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array</title>
  </head>
  <body>
    <script>
      let fruits = ["Mango", "apple", "banana", "litchi", "orange"];
      fruits.push('Nashpati');

      for(let i = 0; i < fruits.length; i++) {
        console.log(`${i} => ${fruits[i]}`);
      }

      for(fruit of fruits) {
        console.log(fruit);
      }
    </script>
  </body>
</html>
