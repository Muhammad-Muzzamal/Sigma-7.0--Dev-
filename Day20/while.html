<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>While Loop</title>
  </head>
  <body>
    <script>
      let i = 1;
      let num = prompt("Enter a number");
      while (i <= num) {
        console.log(i);
        i++;
      }
    </script>
  </body>
</html>
