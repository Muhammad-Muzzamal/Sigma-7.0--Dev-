<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment</title>
  </head>
  <body>
    <script>
      function remove(num, array) {
        for (let i = 0; i < array.length; i++) {
          if (array[i] == num) {
            array.splice(i, 1);
            i--;
          }
        }
      }
      let array = [1, 2, 3, 4, 5, 6, 2, 3];
      let num = 2;
      remove(num, array);
      console.log(array);
    </script>
  </body>
</html>
